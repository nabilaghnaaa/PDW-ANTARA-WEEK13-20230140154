<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Product - TokoRe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <script src="/js/components.js" defer></script>
    <style>
        body {
            min-height: 100vh;
            background: #f7f7f8;
            color: #191c21;
            font-family: Arial, Helvetica, sans-serif;
        }

        .admin-navbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }

        .admin-nav-inner {
            min-height: 72px;
        }

        .brand {
            color: #191c21;
            text-decoration: none;
            font-size: 21px;
            font-weight: 700;
        }

        .page-head {
            padding: 42px 0 26px;
        }

        .page-title {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -.8px;
        }

        .page-description {
            margin: 7px 0 0;
            color: #747b85;
            font-size: 14px;
        }

        .table-card {
            overflow: hidden;
            border: 1px solid #e4e7eb;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 25px rgba(23, 26, 31, .04);
        }

        .admin-table {
            margin: 0;
            vertical-align: middle;
        }

        .admin-table th {
            padding: 15px 18px;
            border-bottom: 1px solid #e7e9ec;
            background: #fafafa;
            color: #777e88;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .admin-table td {
            padding: 16px 18px;
            border-color: #eef0f2;
            color: #414750;
            font-size: 13px;
        }

        .product-thumb {
            width: 62px;
            height: 62px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #fafafa;
        }

        .product-name {
            color: #20242a;
            font-weight: 700;
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f1f2f4;
            color: #5f6670;
            font-size: 11px;
            font-weight: 700;
        }

        .description-cell {
            max-width: 280px;
            color: #747b85;
            line-height: 1.5;
        }

        .action-group {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .modal-content {
            overflow: hidden;
            border: 1px solid #e4e7eb;
            border-radius: 16px;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #eceef1;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid #eceef1;
        }

        .page-message {
            margin-bottom: 18px;
        }

        @media (max-width: 767px) {
            .page-head {
                padding: 30px 0 22px;
            }

            .page-title {
                font-size: 25px;
            }

            .description-cell {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <nav class="admin-navbar">
        <div class="container admin-nav-inner d-flex align-items-center justify-content-between">
            <a href="/" class="brand">TokoRe</a>
            <a href="/" class="text-decoration-none">
                <custom-button text="Kembali" variant="light" size="sm"></custom-button>
            </a>
        </div>
    </nav>

    <main class="container pb-5">
        <section class="page-head">
            <div class="d-flex align-items-center justify-content-between gap-3">
                <div>
                    <h1 class="page-title">Product</h1>
                    <p class="page-description">Kelola produk yang tampil di halaman utama TokoRe.</p>
                </div>

                <custom-button id="btn-add" text="Tambah Produk" variant="dark"></custom-button>
            </div>
        </section>

        <div id="page-message" class="alert page-message" style="display:none;"></div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table admin-table">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Deskripsi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="product-table"></tbody>
                </table>
            </div>
        </div>

        <div id="empty-table" class="text-center py-5 text-muted" style="display:none;">
            Belum ada produk.
        </div>
    </main>

    <div class="modal fade" id="product-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Tambah Produk</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form id="product-form">
                    <div class="modal-body">
                        <custom-input label="Nama Produk" name="name" required></custom-input>

                        <div class="custom-field">
                            <label for="description" class="custom-label">Deskripsi Produk</label>
                            <textarea id="description" name="description" class="custom-textarea" rows="4" required></textarea>
                        </div>

                        <custom-input type="number" label="Harga" name="price" required></custom-input>

                        <custom-input label="Kategori" name="category" required></custom-input>

                        <custom-input type="url" label="URL Gambar Produk" name="image" placeholder="https://..."></custom-input>
                    </div>

                    <div class="modal-footer">
                        <custom-button text="Batal" variant="light" data-bs-dismiss="modal"></custom-button>
                        <custom-button type="submit" text="Simpan" variant="dark"></custom-button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const token = localStorage.getItem("token") || "";
        let editingId = null;

        const modal = new bootstrap.Modal(document.getElementById("product-modal"));
        const form = document.getElementById("product-form");
        const tableBody = document.getElementById("product-table");
        const emptyTable = document.getElementById("empty-table");
        const messageBox = document.getElementById("page-message");

        const formatPrice = (price) => new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(Number(price));

        function showMessage(text, type = "success") {
            messageBox.className = `alert alert-${type} page-message`;
            messageBox.textContent = text;
            messageBox.style.display = "block";

            setTimeout(() => {
                messageBox.style.display = "none";
            }, 3000);
        }

        function openAdd() {
            editingId = null;
            form.reset();
            document.getElementById("modal-title").textContent = "Tambah Produk";
            modal.show();
        }

        function openEdit(product) {
            editingId = product.id;
            form.elements.name.value = product.name;
            form.elements.description.value = product.description;
            form.elements.price.value = product.price;
            form.elements.category.value = product.category;
            form.elements.image.value = product.image || "";
            document.getElementById("modal-title").textContent = "Edit Produk";
            modal.show();
        }

        async function request(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            const data = await response.json();

            if (response.status === 401) {
                localStorage.clear();
                window.location.href = "/login-page";
                return null;
            }

            if (!response.ok) {
                throw new Error(data.message || "Terjadi kesalahan");
            }

            return data;
        }

        function createActionButton(text, variant, callback) {
            const button = document.createElement("custom-button");

            button.setAttribute("text", text);
            button.setAttribute("variant", variant);
            button.setAttribute("size", "sm");

            button.addEventListener("custom-click", callback);

            return button;
        }

        async function loadProducts() {
            try {
                const response = await fetch("/api/products");
                const products = await response.json();

                tableBody.innerHTML = "";
                emptyTable.style.display = products.length ? "none" : "block";

                products.forEach((product) => {
                    const row = document.createElement("tr");

                    const productCell = document.createElement("td");
                    const productWrap = document.createElement("div");

                    productWrap.className = "d-flex align-items-center gap-3";

                    const image = document.createElement("img");
                    image.className = "product-thumb";
                    image.src = product.image || "https://via.placeholder.com/80x80?text=No";
                    image.alt = product.name;

                    const name = document.createElement("div");
                    name.className = "product-name";
                    name.textContent = product.name;

                    productWrap.append(image, name);
                    productCell.appendChild(productWrap);

                    const categoryCell = document.createElement("td");
                    const category = document.createElement("span");

                    category.className = "category-badge";
                    category.textContent = product.category;

                    categoryCell.appendChild(category);

                    const priceCell = document.createElement("td");
                    priceCell.textContent = formatPrice(product.price);

                    const descriptionCell = document.createElement("td");
                    descriptionCell.className = "description-cell";
                    descriptionCell.textContent = product.description;

                    const actionCell = document.createElement("td");
                    const actionGroup = document.createElement("div");

                    actionGroup.className = "action-group";

                    const editButton = createActionButton("Edit", "light", () => {
                        openEdit(product);
                    });

                    const deleteButton = createActionButton("Hapus", "danger", async () => {
                        if (!confirm(`Hapus produk ${product.name}?`)) {
                            return;
                        }

                        try {
                            await request(`/api/products/${product.id}`, {
                                method: "DELETE"
                            });

                            showMessage("Produk berhasil dihapus.");
                            loadProducts();
                        } catch (error) {
                            showMessage(error.message, "danger");
                        }
                    });

                    actionGroup.append(editButton, deleteButton);
                    actionCell.appendChild(actionGroup);

                    row.append(productCell, categoryCell, priceCell, descriptionCell, actionCell);
                    tableBody.appendChild(row);
                });
            } catch (error) {
                showMessage("Gagal mengambil data produk.", "danger");
            }
        }

        document.getElementById("btn-add").addEventListener("custom-click", openAdd);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const data = Object.fromEntries(new FormData(form));
            data.price = Number(data.price);

            try {
                await request(
                    editingId ? `/api/products/${editingId}` : "/api/products",
                    {
                        method: editingId ? "PUT" : "POST",
                        body: JSON.stringify(data)
                    }
                );

                modal.hide();
                showMessage(editingId ? "Produk berhasil diubah." : "Produk berhasil ditambahkan.");
                loadProducts();
            } catch (error) {
                showMessage(error.message, "danger");
            }
        });

        if (!token) {
            window.location.href = "/login-page";
        } else {
            loadProducts();
        }
    </script>
</body>
</html>
