<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Product - TokoRe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <link href="/css/admin-products.css" rel="stylesheet">

    <script src="/js/components.js" defer></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/notification.js" defer></script>
    <script src="/js/admin-products.js" defer></script>
</head>
<body data-page="admin">
    <nav class="admin-navbar">
        <div class="container admin-nav-inner">
            <a href="/" class="admin-brand">TokoRe</a>

            <a href="/" class="text-decoration-none">
                <custom-button
                    text="Kembali"
                    variant="light"
                    size="sm"
                ></custom-button>
            </a>
        </div>
    </nav>

    <main class="container pb-5">
        <section class="page-head">
            <div class="page-head-content">
                <div>
                    <h1 class="page-title">Product</h1>

                    <p class="page-description">
                        Kelola produk yang tampil di TokoRe.
                    </p>
                </div>

                <custom-button
                    id="btn-add"
                    text="Tambah Produk"
                    variant="primary"
                ></custom-button>
            </div>
        </section>

        <div
            class="table-card"
            id="product-table-wrapper"
        >
            <div class="table-responsive">
                <table class="table admin-table">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Deskripsi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="product-table"></tbody>
                </table>
            </div>
        </div>

        <div
            id="empty-table"
            class="empty-admin"
            style="display:none;"
        >
            Belum ada produk.
        </div>
    </main>

    <div
        class="modal fade"
        id="product-modal"
        tabindex="-1"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5
                        class="modal-title"
                        id="modal-title"
                    >
                        Tambah Produk
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <form id="product-form">
                    <div class="modal-body">
                        <custom-input
                            label="Nama Produk"
                            name="name"
                            required
                        ></custom-input>

                        <div class="custom-field">
                            <label
                                for="description"
                                class="custom-label"
                            >
                                Deskripsi Produk
                            </label>

                            <textarea
                                id="description"
                                name="description"
                                class="custom-textarea"
                                rows="4"
                                required
                            ></textarea>
                        </div>

                        <custom-input
                            type="number"
                            label="Harga"
                            name="price"
                            required
                        ></custom-input>

                        <custom-input
                            label="Kategori"
                            name="category"
                            required
                        ></custom-input>

                        <custom-input
                            type="url"
                            label="URL Gambar Produk"
                            name="image"
                            placeholder="https://..."
                        ></custom-input>
                    </div>

                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-light"
                            data-bs-dismiss="modal"
                        >
                            Batal
                        </button>

                        <custom-button
                            type="submit"
                            text="Simpan"
                            variant="primary"
                        ></custom-button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
