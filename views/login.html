<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/components.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>
        <form id="login-form">
            <custom-input type="text" label="Username" name="username"></custom-input>
            <custom-input type="password" label="Password" name="password"></custom-input>
            <custom-button text="Masuk" btn-class="btn-primary w-100 mt-3"></custom-button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    localStorage.setItem('isLoggedIn', 'true');
                    alert("Dialog: 'Mantap, login sukses!'");
                    window.location.href = '/'; 
                } else {
                    alert("Dialog: 'Waduh, username atau password salah nih.'");
                }
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
