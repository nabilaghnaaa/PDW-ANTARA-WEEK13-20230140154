<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TokoRe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <script src="/js/components.js" defer></script>
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            background: #f7f7f8;
            color: #191c21;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-wrapper {
            width: min(410px, calc(100% - 30px));
        }

        .login-card {
            padding: 32px;
            border: 1px solid #e3e6ea;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 15px 40px rgba(23, 26, 31, .06);
        }

        .login-brand {
            margin-bottom: 7px;
            font-size: 24px;
            font-weight: 700;
        }

        .login-description {
            margin: 0 0 28px;
            color: #7b828c;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-submit {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">TokoRe</div>
            <p class="login-description">Masuk untuk mengelola produk dan menggunakan fitur toko.</p>

            <form id="login-form">
                <custom-input type="text" label="Username" name="username" required></custom-input>
                <custom-input type="password" label="Password" name="password" required></custom-input>

                <div id="login-error" class="alert alert-danger py-2" style="display:none;"></div>

                <custom-button type="submit" text="Masuk" variant="dark" class="login-submit"></custom-button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);
            const errorBox = document.getElementById("login-error");

            errorBox.style.display = "none";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    errorBox.textContent = result.message || "Login gagal.";
                    errorBox.style.display = "block";
                    return;
                }

                localStorage.setItem("token", result.token);
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("username", result.user.username);
                localStorage.setItem("role", result.user.role || "user");

                window.location.href = "/";
            } catch (error) {
                errorBox.textContent = "Tidak dapat terhubung ke server.";
                errorBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
