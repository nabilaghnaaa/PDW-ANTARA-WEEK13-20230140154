<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - TokoRe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <link href="/css/login.css" rel="stylesheet">

    <script src="/js/components.js" defer></script>
    <script src="/js/auth.js" defer></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">TokoRe</div>

            <p class="login-description">
                Masuk sebagai admin untuk mengelola produk TokoRe.
            </p>

            <form id="login-form">
                <custom-input
                    type="text"
                    label="Username"
                    name="username"
                    required
                ></custom-input>

                <custom-input
                    type="password"
                    label="Password"
                    name="password"
                    required
                ></custom-input>

                <div
                    id="login-error"
                    class="alert alert-danger py-2"
                    style="display:none;"
                ></div>

                <custom-button
                    type="submit"
                    text="Masuk"
                    variant="primary"
                    class="login-submit"
                ></custom-button>
            </form>
        </div>
    </div>
</body>
</html>
