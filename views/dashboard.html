<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Belanja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/components.js" defer></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">TokoKaisar</a>
            <div class="d-flex gap-2">
                <div id="cart-container">
                    <custom-button text="Keranjang (0)" btn-class="btn-outline-light" id="btn-cart"></custom-button>
                </div>
                <a href="/login-page" class="btn btn-primary" id="btn-login-nav">Login</a>
                <button class="btn btn-danger" id="btn-logout" style="display: none;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Produk Pilihan</h2>
        <div class="row" id="product-list">
        </div>
    </div>

    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

        if (isLoggedIn) {
            document.getElementById('btn-login-nav').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'block';
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn');
            window.location.reload();
        });

        document.getElementById('cart-container').addEventListener('click', () => {
            if (!isLoggedIn) {
                alert("Dialog: 'Kamu harus login dulu buat buka keranjang ya!'");
                window.location.href = '/login-page';
            } else {
                alert("Dialog: 'Keranjang berhasil dibuka!'");
            }
        });

        /**
         * Fetches real product data from FakeStore API and renders it to the DOM.
         * @returns {Promise<void>}
         */
        async function loadProducts() {
            try {
                const response = await fetch('https://fakestoreapi.com/products?limit=6');
                const products = await response.json();
                const productList = document.getElementById('product-list');

                products.forEach(product => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 mb-4';
                    col.innerHTML = `
                        <div class="card h-100 shadow-sm">
                            <img src="${product.image}" class="card-img-top p-3" alt="${product.title}" style="height: 250px; object-fit: contain;">
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title text-truncate">${product.title}</h6>
                                <p class="card-text fw-bold">$${product.price}</p>
                                <div class="mt-auto" onclick="addToCart()">
                                    <custom-button text="Tambah ke Keranjang" btn-class="btn-success w-100"></custom-button>
                                </div>
                            </div>
                        </div>
                    `;
                    productList.appendChild(col);
                });
            } catch (error) {
                console.error(error);
            }
        }

        /**
         * Handles the add to cart logic based on authentication state.
         * @returns {void}
         */
        function addToCart() {
            if (!isLoggedIn) {
                alert("Dialog: 'Login dulu bosku sebelum masukin barang ke keranjang!'");
            } else {
                alert("Dialog: 'Barang masuk keranjang!'");
            }
        }

        loadProducts();
    </script>
</body>
</html>
