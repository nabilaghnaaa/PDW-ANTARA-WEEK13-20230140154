<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Belanja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/components.js" defer></script>
    <style>
        body { min-height: 100vh; }
        .product-card { transition: .2s ease; }
        .product-card:hover { transform: translateY(-3px); }
        .product-image { height: 250px; object-fit: contain; }
        .chat-box { position: fixed; right: 20px; bottom: 20px; width: min(360px, calc(100vw - 40px)); z-index: 1050; }
        .chat-panel { display: none; }
        .chat-panel.show { display: block; }
        .chat-messages { height: 320px; overflow-y: auto; background: #f8f9fa; }
        .chat-message { white-space: pre-wrap; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">TokoRe</a>
            <div class="d-flex gap-2 align-items-center">
                <a href="/admin/products" class="btn btn-outline-light" id="btn-admin" style="display:none;">Admin Produk</a>
                <div id="cart-container">
                    <custom-button text="Keranjang (0)" btn-class="btn-outline-light" id="btn-cart"></custom-button>
                </div>
                <a href="/login-page" class="btn btn-primary" id="btn-login-nav">Login</a>
                <button class="btn btn-danger" id="btn-logout" style="display:none;">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Produk Pilihan</h2>
                <p class="text-muted mb-0">Temukan produk yang tersedia di TokoRe.</p>
            </div>
        </div>

        <div class="row g-4" id="product-list"></div>
        <div id="empty-state" class="text-center text-muted py-5" style="display:none;">Belum ada produk.</div>
    </main>

    <div class="chat-box">
        <div class="card shadow-sm chat-panel" id="chat-panel">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>AI Chat</strong>
                <button class="btn btn-sm btn-light" id="chat-close">Tutup</button>
            </div>
            <div class="chat-messages p-3" id="chat-messages">
                <div class="small text-muted mb-2">Tanyakan tentang produk, harga, kategori, atau fitur toko.</div>
            </div>
            <form id="chat-form" class="border-top p-2">
                <div class="input-group">
                    <input type="text" class="form-control" id="chat-input" placeholder="Tulis pertanyaan..." maxlength="1000" required>
                    <button class="btn btn-primary" type="submit">Kirim</button>
                </div>
            </form>
        </div>
        <button class="btn btn-dark shadow-sm w-100 mt-2" id="chat-toggle">AI Chat</button>
    </div>

    <script>
        const token = localStorage.getItem("token") || "";
        const isLoggedIn = Boolean(token);
        const chatHistory = [];
        const productList = document.getElementById("product-list");
        const emptyState = document.getElementById("empty-state");
        const formatPrice = (price) => new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(Number(price));

        const showAuthState = () => {
            document.getElementById("btn-login-nav").style.display = isLoggedIn ? "none" : "block";
            document.getElementById("btn-logout").style.display = isLoggedIn ? "block" : "none";
            document.getElementById("btn-admin").style.display = isLoggedIn ? "block" : "none";
        };

        const addToCart = () => {
            if (!isLoggedIn) {
                alert("Silakan login dulu untuk menambahkan produk ke keranjang.");
                window.location.href = "/login-page";
                return;
            }

            alert("Produk berhasil dimasukkan ke keranjang.");
        };

        async function loadProducts() {
            try {
                const response = await fetch("/api/products");
                const products = await response.json();

                productList.innerHTML = "";
                emptyState.style.display = products.length ? "none" : "block";

                products.forEach((product) => {
                    const col = document.createElement("div");
                    col.className = "col-md-4";

                    const card = document.createElement("div");
                    card.className = "card h-100 shadow-sm product-card";

                    const image = document.createElement("img");
                    image.className = "card-img-top p-3 product-image";
                    image.alt = product.name;
                    image.src = product.image || "https://via.placeholder.com/400x250?text=No+Image";

                    const body = document.createElement("div");
                    body.className = "card-body d-flex flex-column";

                    const category = document.createElement("div");
                    category.className = "small text-muted mb-2";
                    category.textContent = product.category;

                    const title = document.createElement("h5");
                    title.className = "card-title";
                    title.textContent = product.name;

                    const description = document.createElement("p");
                    description.className = "card-text text-muted flex-grow-1";
                    description.textContent = product.description;

                    const price = document.createElement("p");
                    price.className = "card-text fw-bold mb-3";
                    price.textContent = formatPrice(product.price);

                    const button = document.createElement("button");
                    button.className = "btn btn-success w-100";
                    button.textContent = "Tambah ke Keranjang";
                    button.addEventListener("click", addToCart);

                    body.append(category, title, description, price, button);
                    card.append(image, body);
                    col.appendChild(card);
                    productList.appendChild(col);
                });
            } catch (error) {
                emptyState.style.display = "block";
                emptyState.textContent = "Gagal mengambil data produk.";
            }
        }

        document.getElementById("btn-logout").addEventListener("click", async () => {
            try {
                await fetch("/logout", {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });
            } finally {
                localStorage.removeItem("token");
                localStorage.removeItem("isLoggedIn");
                localStorage.removeItem("username");
                window.location.reload();
            }
        });

        document.getElementById("cart-container").addEventListener("click", () => {
            if (!isLoggedIn) {
                alert("Silakan login dulu untuk membuka keranjang.");
                window.location.href = "/login-page";
                return;
            }

            alert("Fitur keranjang akan digunakan dari halaman belanja.");
        });

        document.getElementById("chat-toggle").addEventListener("click", () => {
            document.getElementById("chat-panel").classList.toggle("show");
        });

        document.getElementById("chat-close").addEventListener("click", () => {
            document.getElementById("chat-panel").classList.remove("show");
        });

        document.getElementById("chat-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const input = document.getElementById("chat-input");
            const message = input.value.trim();

            if (!message) {
                return;
            }

            const messages = document.getElementById("chat-messages");
            const userMessage = document.createElement("div");

            userMessage.className = "chat-message text-end mb-2";
            userMessage.textContent = message;
            messages.appendChild(userMessage);

            input.value = "";

            const payloadHistory = [...chatHistory];
            const pendingMessage = document.createElement("div");

            pendingMessage.className = "chat-message text-muted mb-2";
            pendingMessage.textContent = "Sedang memproses...";
            messages.appendChild(pendingMessage);
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch("/api/ai/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message,
                        history: payloadHistory
                    })
                });

                const data = await response.json();
                pendingMessage.remove();

                const answer = data.answer || data.message || "Maaf, terjadi kesalahan.";
                const aiMessage = document.createElement("div");

                aiMessage.className = "chat-message mb-3";
                aiMessage.textContent = answer;
                messages.appendChild(aiMessage);

                chatHistory.push(
                    { role: "user", content: message },
                    { role: "assistant", content: answer }
                );

                while (chatHistory.length > 6) {
                    chatHistory.shift();
                }
            } catch (error) {
                pendingMessage.textContent = "AI sedang tidak bisa digunakan.";
            }

            messages.scrollTop = messages.scrollHeight;
        });

        showAuthState();
        loadProducts();
    </script>
</body>
</html>
